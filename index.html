<!DOCTYPE html>
<html class="home-page-root" lang="en">
<head>
	<title>HELLOTEACHER</title>
	<meta name="description" content="Art, CAD projects, journal entries, and notes from HELLOTEACHER.">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta charset="utf-8">
	<link href="kombucha.css?v=20260816-overscroll1" rel="stylesheet" type="text/css" media="all">
	<script src="/assets/js/shader-background.js?v=20260815-4" defer></script>
	<script src="/assets/js/main.js?v=20260815-4" defer></script>
</head>
<body class="home-page">

	<div class="container">

		<main id="content" class="home-main">
			<canvas class="home-gradient-shader" data-gradient-shader aria-hidden="true"></canvas>

			<section class="home-artwork" aria-label="Homepage artwork" data-parallax-scene>
				<div class="home-artwork__stage">
					<img class="home-artwork__layer home-artwork__layer--bg" src="/assets/images/site/bg/bg.png" alt="" aria-hidden="true" data-parallax-speed="-1.0" decoding="async">
					<img class="home-artwork__layer home-artwork__layer--arch" src="/assets/images/site/bg/bg_arch.png" alt="" aria-hidden="true" data-parallax-speed="0.20" decoding="async">
					<img class="home-artwork__layer home-artwork__layer--water" src="/assets/images/site/bg/bg_water.png" alt="" aria-hidden="true" data-parallax-speed="1.25" decoding="async">
					<img class="home-artwork__layer home-artwork__layer--statue" src="/assets/images/site/bg/bg_statue.png" alt="" aria-hidden="true" data-parallax-speed="1" decoding="async">
					<img class="home-artwork__layer home-artwork__layer--water2" src="/assets/images/site/bg/bg_water2.png" alt="" aria-hidden="true" data-parallax-speed="1.5" decoding="async">
					<img class="home-artwork__layer home-artwork__layer--water3" src="/assets/images/site/bg/bg_water3.png" alt="" aria-hidden="true" data-parallax-speed="1.65" decoding="async">
					<img class="home-artwork__layer home-artwork__layer--arch2" src="/assets/images/site/bg/bg_arch2.png" alt="" aria-hidden="true" data-parallax-speed="2" decoding="async">
					<img class="home-artwork__layer home-artwork__layer--water4" src="/assets/images/site/bg/bg_water4.png" alt="" aria-hidden="true" data-parallax-speed="2.15" decoding="async">
					<img class="home-artwork__layer home-artwork__layer--separation" src="/assets/images/site/bg/bg_separation.png" alt="" aria-hidden="true" data-parallax-speed="3.25" decoding="async">
				</div>
			</section>

			<section class="home-directory" aria-label="Pages">

				<div class="home-card-grid">
					<a class="art-sprite-card" href="/art/" aria-label="Art" data-sprite-card="art">
						<span class="art-sprite-card__scene" aria-hidden="true" data-art-card-scene></span>
						<span class="art-sprite-card__hitbox" aria-hidden="true" data-card-hitbox></span>
						<span class="art-sprite-card__fallback">Art</span>
					</a>

					<a class="cad-sprite-card" href="/cad/" aria-label="CAD" data-sprite-card="cad">
						<span class="cad-sprite-card__scene" aria-hidden="true" data-cad-card-scene></span>
						<span class="cad-sprite-card__hitbox" aria-hidden="true" data-card-hitbox></span>
						<span class="cad-sprite-card__fallback">CAD</span>
					</a>

					<a class="journal-sprite-card" href="/journal/" aria-label="Journal" data-sprite-card="journal">
						<span class="journal-sprite-card__scene" aria-hidden="true" data-journal-card-scene></span>
						<span class="journal-sprite-card__hitbox" aria-hidden="true" data-card-hitbox></span>
						<span class="journal-sprite-card__fallback">Journal</span>
					</a>

					<a class="home-card home-card--about home-card--edge-right" href="/about/">
						<span class="home-card__media" aria-hidden="true"></span>
						<span class="home-card__body">
							<span class="home-card__label">Info</span>
							<strong>About</strong>
							<span>Context for the site, the maker, and the things collected here.</span>
						</span>
					</a>
				</div>
			</section>
		</main>

		<footer class="site-footer">
			<nav class="footer-nav" aria-label="Footer navigation">
				<a href="/">Home</a>
				<a href="/art/">Art</a>
				<a href="/cad/">CAD</a>
				<a href="/journal/">Journal</a>
				<a href="/about/">About</a>
			</nav>

			<p>Layout adapted from <a href="https://ribo.zone/free/layouts/">kombucha.css by ribo.zone</a>.</p>
			<p>Hosted with <a href="https://neocities.org/">Neocities</a>.</p>
		</footer>

	</div>

</body>
</html>
