<!DOCTYPE html>
<html class="journal-page-root" lang="en">
<head>
  <title>Journal - HELLOTEACHER</title>
  <meta name="description" content="Journal entries from HELLOTEACHER.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">

	<link href="/kombucha.css?v=20260908-journal1" rel="stylesheet" type="text/css" media="all">
  <script src="/assets/js/journal.js?v=20260908-journal1" defer></script>
</head>

<body class="journal-page">
  <main class="journal-page__surface" data-journal-app>
    <header class="journal-page__topline">
      <a class="journal-page__home" href="/">Home</a>
      <h1>Journal</h1>
      <p data-journal-count>Loading entries</p>
    </header>

    <section class="journal-index" data-journal-index aria-label="Journal entries">
      <p class="journal-index__status">Loading entries...</p>
    </section>

    <section class="journal-reader" data-journal-reader role="dialog" aria-modal="true" aria-labelledby="journal-reader-title" hidden>
      <div class="journal-reader__shell">
        <header class="journal-reader__topline">
          <button class="journal-reader__back" type="button" data-journal-close>Back</button>
          <div class="journal-reader__heading">
            <p><time data-journal-reader-date></time></p>
            <h2 id="journal-reader-title" data-journal-reader-title></h2>
          </div>
        </header>

        <article class="journal-reader__content" data-journal-reader-content tabindex="0"></article>
      </div>
    </section>
  </main>
</body>
</html>
